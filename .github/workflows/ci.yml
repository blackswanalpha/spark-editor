name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  #  Frontend checks — fast feedback, blocks merge
  # ---------------------------------------------------------------
  frontend:
    name: frontend (typecheck • lint • test • build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck (tsc -b --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest --passWithNoTests)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      - name: Upload dist (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  #  Rust / Tauri host checks — runs in parallel, non-blocking for
  #  frontend-only PRs but required for release branches.
  # ---------------------------------------------------------------
  rust:
    name: rust (cargo check • clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            javascriptcoregtk4.1-dev

      - name: Cargo check (lib)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo clippy (warn-only)
        working-directory: src-tauri
        run: cargo clippy --locked -- -W clippy::pedantic -A clippy::module_name_repetitions || true

  # ---------------------------------------------------------------
  #  Gate — single required status check for branch protection.
  #  Add this job name to Settings > Branches > Require status checks.
  # ---------------------------------------------------------------
  gate:
    name: CI gate ✓
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    if: always()
    steps:
      - name: Evaluate
        run: |
          echo "frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "::error::frontend checks failed"
            exit 1
          fi
          # rust is advisory on feature branches, required on main/develop/release/*
          if [[ "${{ github.ref }}" == refs/heads/main* || "${{ github.ref }}" == refs/heads/develop* || "${{ github.ref }}" == refs/heads/release/* ]]; then
            if [[ "${{ needs.rust.result }}" != "success" ]]; then
              echo "::error::rust checks failed on protected branch"
              exit 1
            fi
          else
            if [[ "${{ needs.rust.result }}" != "success" ]]; then
              echo "::warning::rust checks failed (advisory on feature branch)"
            fi
          fi
          echo "✓ CI gate passed"
